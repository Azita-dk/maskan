name = "maskan-sheypoor"
main = "sheypoor.js"
compatibility_date = "2026-08-01"

[[d1_databases]]
binding = "DB"
database_name = "maskan"
database_id = "eeb8ef9c-6572-4107-9a3e-f105c6556449"

[[kv_namespaces]]
binding = "SITE"
id = "435ef92702274deea775331b1dceffb0"

[observability]
enabled = true

[vars]
PAGES_PER_RUN = "25"
MAX_PAGES = "80"
PAUSE_MS = "1000"
RECHECK = "40"

[triggers]
crons = ["*/3 * * * *"]
