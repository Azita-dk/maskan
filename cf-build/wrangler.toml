name = "maskan-build"
main = "build.js"
compatibility_date = "2026-08-01"

[[d1_databases]]
binding = "DB"
database_name = "maskan"
database_id = "eeb8ef9c-6572-4107-9a3e-f105c6556449"

[[kv_namespaces]]
binding = "SITE"
id = "435ef92702274deea775331b1dceffb0"

[observability]
enabled = true

# SLICE — cities rebuilt per invocation.
# FREE PLAN VALUE: "8"    (10 ms CPU; all 48 at once used to fail)
#
# Memory, not CPU, sets this. A Worker gets 128 MB whatever the plan, and
# 100 cities meant holding 300,000 listings at once — every tick died with
# exceededMemory after using 7.7 s of its 30 s CPU. Tehran alone is 45,000.
#
# Eight cities is roughly 80,000 listings at the worst end — Tehran plus the
# next few. stats.json is now written on every slice rather than only at the
# end of a pass, so a smaller slice no longer means a stale file; it means
# each city is refreshed every eight slices instead of every one.
#
# If exceededMemory comes back in Observability, drop to 6, then 4. The
# database grows daily, so a number that fits today may not next month.
[vars]
SLICE = "8"

# FREE PLAN VALUE: ["*/10 * * * *"] — ten minutes, when a tick only managed
# 8 cities and a full pass took six of them.
#
# The build is what the site reads, so this interval is how stale the site
# can be. At SLICE = 48 one tick rebuilds the whole country, so five minutes
# halves the lag. It re-reads every listing each time, which is the cost.
[triggers]
crons = ["*/5 * * * *"]
